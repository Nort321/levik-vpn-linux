name: Linux build and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Linux build and network test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 nftables iproute2 libcap2-bin libarchive-tools rpm
      - run: npm ci
      - name: Set unique release version
        id: version
        run: |
          version=$(node -e 'const p=require("./package.json"); const [major,minor,patch]=p.version.split(".").map(Number); if (![major,minor,patch].every(Number.isSafeInteger)) process.exit(1); console.log(`${major}.${minor}.${patch+Number(process.env.GITHUB_RUN_NUMBER)}`)')
          npm version --no-git-tag-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run download:xray
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Test real Linux TUN and nftables in an isolated network namespace
        run: sudo unshare --net python3 scripts/linux-smoke.py
      - run: npm run package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Inspect packages and checksum release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "release/LevikVPN-Linux-${VERSION}-x86_64.AppImage"
          test -f "release/LevikVPN-Linux-${VERSION}-amd64.deb"
          test -f release/latest-linux.yml
          dpkg-deb --info "release/LevikVPN-Linux-${VERSION}-amd64.deb"
          cp "release/LevikVPN-Linux-${VERSION}-x86_64.AppImage" release/LevikVPN-Linux-x64.AppImage
          cp "release/LevikVPN-Linux-${VERSION}-amd64.deb" release/LevikVPN-Linux-x64.deb
          cd release
          sha256sum *.AppImage *.deb latest-linux.yml > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: LevikVPN-Linux-${{ steps.version.outputs.version }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: LevikVPN-Linux-${{ needs.build.outputs.version }}
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$COMMIT_SHA" \
              --title "Levik VPN for Linux ${VERSION}" \
              --notes "Automated Linux x64 build. Download AppImage or Debian package and verify SHA256SUMS.txt. See README for prerequisites and keyboard shortcuts." --draft
          fi
          gh release edit "$tag" --draft=false --prerelease=false --latest
