name: Linux build and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release to users (otherwise it stays a draft)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core:
    name: Fetch pinned Rust module
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout or application/dependency code runs with this write token.
      - name: Read own-repository draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p core-input/linux-x64
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/711070597" -H "Accept: application/octet-stream" > core-input/linux-x64/levik_core.node
          printf '%s\n' 'aa06769aeceb46b81c4ba51c92016428b08ce78491ad0b4f4f8e5ad0dd014499  core-input/linux-x64/levik_core.node' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: levik-core-pinned
          path: core-input/
          if-no-files-found: error
          retention-days: 1
  build:
    needs: core
    if: ${{ always() && (needs.core.result == 'success' || (github.event_name == 'pull_request' && needs.core.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Linux build and network test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 nftables iproute2 libcap2-bin libarchive-tools rpm
      - run: npm ci
      - name: Set unique release version
        id: version
        run: |
          version=$(node -e 'const p=require("./package.json"); const [major,minor,patch]=p.version.split(".").map(Number); if (![major,minor,patch].every(Number.isSafeInteger)) process.exit(1); console.log(`${major}.${minor}.${patch+Number(process.env.GITHUB_RUN_NUMBER)}`)')
          npm version --no-git-tag-version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run download:xray
      - uses: actions/download-artifact@v4
        if: needs.core.result == 'success'
        with:
          name: levik-core-pinned
          path: vendor/levik-core
      - name: Verify pinned Rust module
        if: needs.core.result == 'success'
        run: npm run download:levik-core -- --verify-local
      - name: Optional Rust module for pull requests
        if: needs.core.result == 'skipped'
        run: npm run download:levik-core
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          LEVIK_TEST_CORE: ${{ needs.core.result == 'success' && format('{0}/vendor/levik-core/linux-x64/levik_core.node', github.workspace) || '' }}
      - name: Verify live Xray flow continuity and automatic controls
        run: node scripts/smoke-smart-auto-flows.mjs
      - name: Test real Linux TUN and nftables in an isolated network namespace
        run: |
          sudo env PYTHONPATH=tests python3 -m unittest test_network_helper.LifetimeTests
          sudo unshare --net python3 scripts/linux-smoke.py
      - run: npm run package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Load bundled Rust core in Electron
        if: needs.core.result == 'success'
        run: |
          set -euo pipefail
          ELECTRON_RUN_AS_NODE=1 release/linux-unpacked/levik-vpn scripts/smoke-bundled-core.cjs release/linux-unpacked/resources/levik-core/levik_core.node "0.6.0"
      - name: Inspect packages and checksum release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -f "release/LevikVPN-Linux-${VERSION}-x86_64.AppImage"
          test -f "release/LevikVPN-Linux-${VERSION}-amd64.deb"
          test -f release/latest-linux.yml
          dpkg-deb --info "release/LevikVPN-Linux-${VERSION}-amd64.deb"
          cp "release/LevikVPN-Linux-${VERSION}-x86_64.AppImage" release/LevikVPN-Linux-x64.AppImage
          cp "release/LevikVPN-Linux-${VERSION}-amd64.deb" release/LevikVPN-Linux-x64.deb
          cd release
          sha256sum *.AppImage *.deb latest-linux.yml > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: LevikVPN-Linux-${{ steps.version.outputs.version }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: LevikVPN-Linux-${{ needs.build.outputs.version }}
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk '/^## / {section++; next} section == 1 {print}' CHANGELOG.md > "$notes"
          test -s "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$COMMIT_SHA" \
              --title "Levik VPN for Linux ${VERSION}" \
              --notes-file "$notes" --draft
          fi
          gh release edit "$tag" --notes-file "$notes"
          if [ "$PUBLISH" = "true" ]; then
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
